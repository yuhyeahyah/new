name: Atualizar playlists

on:
  # Horários em UTC (BRT = UTC-3).
  #   00:15 UTC = 21:15 BRT  -> logo depois das playlists atualizarem (~21:05)
  #   00:45 UTC = 21:45 BRT  -> segunda chance (o cron do GitHub costuma atrasar)
  #   e a cada 3 horas pra pegar mudanças fora do horário fixo
  schedule:
    - cron: "15 0 * * *"
    - cron: "45 0 * * *"
    - cron: "0 3,6,9,12,15,18 * * *"
  # Botão "Run workflow" no GitHub, pra gerar o primeiro arquivo sem esperar
  workflow_dispatch:

permissions:
  contents: write # necessário pro commit do playlists.json

concurrency:
  group: playlists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Raspar playlists
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: deno run --allow-net --allow-write --allow-env=SITE_URL scrape-playlists.ts

      - name: Commitar se mudou
        run: |
          if git diff --quiet -- playlists.json; then
            echo "Sem mudanças, nada a commitar"
            exit 0
          fi
          git config user.name "playlists-bot"
          git config user.email "playlists-bot@users.noreply.github.com"
          git add playlists.json
          git commit -m "playlists: atualiza $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin ${{ github.ref_name }}
          git push
